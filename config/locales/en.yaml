# English case text — the reference catalogue (see astra/locale.py).
#
# Every sentence ASTRA writes about a case is a template here, filled with the
# values the agents produced. A translation (hi.yaml) has the same keys and the
# same {placeholders}; tests/test_case_language.py enforces both. Framing rules
# apply in every language: a detection is a risk indicator for human review,
# never a finding of fraud or wrongdoing.
#
# Format specs follow Python: {days:,} groups thousands, {share:.0%} is a
# percentage, {pct:+.0f} keeps the sign. Keep quotes: YAML reads a bare 5.2 as
# a number.

money:
  lakh: "₹{amount} lakh"
  crore: "₹{amount} crore"

list_separator: ", "

agent:
  compliance:
    label: "Compliance Agent"
    role: "Checks each work against MPLADS scheme rules"
  anomaly:
    label: "Statistical Anomaly Agent"
    role: "Compares cost against similar works in the same state"
  entity_resolution:
    label: "Entity Resolution Agent"
    role: "Looks for the same work recorded more than once"
  network:
    label: "Network Analysis Agent"
    role: "Looks at vendor, implementing-agency and district-authority patterns"
  revisions:
    label: "Revision Agent"
    role: "Looks at what changed on a work after it was sanctioned"
  payments:
    label: "Payment Agent"
    role: "Reads each payment against the work's sanction and completion dates"

severity:
  critical: "Critical"
  high: "High"
  medium: "Medium"
  low: "Low"

risk_band:
  high: "High risk"
  medium: "Medium risk"
  low: "Low risk"

# ------------------------------------------------------------------ findings

finding:
  default_action: "Verify the supporting records for this work."

confidence:
  plain: "{plain} Data confidence is reduced: {reasons}."
  separator: "; "
  action: "Verify the record on the portal before acting on this signal."
  reason:
    parity_differs: "the area's stored figures currently differ from the portal's"
    unchecked: "the area has not yet been checked against the portal's figures"
    failed: "the latest {count} read(s) of the area failed"
    stale: "the area has not been read successfully since {since} UTC"
    held_back: "the area's latest read was held back by validation"
    missing: "{count} work(s) the area listed are missing and awaiting confirmation"

R-TIME-01:
  headline: "Work is overdue against the one-year completion norm"
  plain: "This work was sanctioned {days:,} days ago ({years:.1f} years) and is {progress}. The guidelines expect the sanction letter to set a completion time of generally no more than one year (para 3.2.12); a longer period is allowed when the sanction letter justifies it."
  incomplete: "still not complete"
  completed_late: "recorded as completed late"
  metric: "{days:,} days since sanction"
  benchmark: "{max_days} days (para 3.2.12)"
  actions:
    - "Obtain the current physical progress report from the implementing agency."
    - "Check whether the sanction letter justified a period longer than one year."
    - "Ask the agency to record the reason for delay and a revised completion date."

R-PROH-01:
  para_ref: " (para {para})"
  activity:
    headline: "Expenditure may not be an admissible MPLADS charge"
    plain: "The description indicates '{term}', which the guidelines' list of works not permitted excludes{para_ref}. Repair and renovation of an asset is permitted (para 5.1.9), so the scope needs confirming before any release."
    actions:
      - "Confirm from the estimate what the expenditure is actually for."
  asset:
    headline: "Asset may fall in the scheme's non-permissible list"
    plain: "The work description suggests the asset being created is a '{term}', which the guidelines do not permit{para_ref}. This needs confirming — descriptions often name nearby landmarks, so the actual asset may well be permissible."
    actions:
      - "Confirm from the sanction file what asset is actually being built."
  metric: "matched term: '{term}'"
  benchmark: "works not permitted, para {para}"

R-COST-01:
  summary:
    headline: "Many works sanctioned below the normal minimum value"
    plain: "{works:,} of this district authority's {out_of:,} sanctioned works ({share:.0%}) are below Rs 2.5 lakh. The guidelines allow a smaller work only when the sanction letter records the reasons (para 3.2.9)."
    metric: "{works:,} works below Rs 2.5 lakh"
    benchmark: "Rs 2.5 lakh normal minimum (para 3.2.9)"
    actions:
      - "Check a sample of these sanction letters for recorded reasons, starting with the examples listed."
  floor:
    headline: "Sanctioned below the normal minimum work value"
    plain: "This work is sanctioned at {cost}. The guidelines say a work should normally be at least {floor}, and allow a smaller one when the district authority records its reasons in the sanction letter (para 3.2.9). Very small works can also indicate a larger work split into pieces."
    metric: "{cost} sanctioned"
    benchmark: "{floor} normal minimum (para 3.2.9)"
    actions:
      - "Check that the sanction letter records the reasons for the smaller amount."
      - "Check whether this is part of a larger work split into smaller sanctions."
  ceiling:
    headline: "Large single work: check the detailed estimate"
    plain: "This work is sanctioned at {cost}, above the {ceiling} value ASTRA uses as a prompt to check the estimate. The guidelines set no maximum for a work; works of Rs 25 lakh or more must also be covered by third-party inspection (para 4.4.2)."
    metric: "{cost} sanctioned"
    benchmark: "{ceiling} ASTRA review marker (not a scheme limit)"
    actions:
      - "Verify the detailed estimate and technical sanction for a work of this size."

R-PILE-01:
  headline: "Funds are lying largely unspent"
  plain: "Spending on works recommended over {years} completed years is only {pct:.0f}% of the {entitlement} entitlement for those years. MPLADS funds are carried forward rather than lost (para 10.4.4), so unspent money accumulates — this is an efficiency concern, not a rule breach."
  metric: "{pct:.0f}% of funds utilised"
  benchmark: "{threshold:.0f}% threshold"
  actions:
    - "Review the pending works list and identify what is blocking execution."

R-SPIKE-01:
  headline: "Sudden surge in spending after dormant years"
  plain: "Utilisation jumped to {spike:.0f}% in {fy} after years averaging {dormant:.0f}%. Because MPLADS funds never lapse, a late surge can indicate rushed, year-end spending."
  metric: "{spike:.0f}% in {fy}"
  benchmark: "{dormant:.0f}% in prior years"
  actions:
    - "Check whether works sanctioned in the surge year followed normal appraisal."

R-SCST-02:
  headline: "Low share of spending in {kind}-reserved constituencies"
  plain: "In {state}, {kind}-reserved constituencies received {pct:.1f}% of MPLADS spending, against a {benchmark}% scheme benchmark. This is a screening indicator only — the scheme's requirement concerns SC/ST areas, which this dataset does not itemise."
  metric: "{pct:.1f}% of state spending"
  benchmark: "{benchmark}% scheme benchmark"
  actions:
    - "Pull district-level allocation data to assess actual area-wise compliance."

R-SANC-01:
  benchmark: "45 days (para 3.2.4)"
  summary:
    headline: "Recommendations waiting for sanction beyond 45 days"
    plain: "{works:,} recommendations to this district authority have waited more than 45 days for sanction or rejection ({share:.0%} of those pending). The guidelines allow 45 days (para 3.2.4), not counting model code of conduct periods (para 3.2.6), which this count cannot leave out."
    metric: "{works:,} waiting beyond 45 days"
    actions:
      - "Review the pending list with the district authority, starting with the longest waiting."
  single:
    headline: "Recommendation waiting for sanction beyond 45 days"
    plain: "This work was recommended {days:,} days ago and has not been sanctioned or rejected. The guidelines give the district authority 45 days (para 3.2.4). The count starts from the recommendation date and cannot leave out model code of conduct periods, which the guidelines exclude (para 3.2.6), so the real delay may be shorter."
    metric: "{days:,} days waiting"
    actions:
      - "Ask the district authority to sanction or reject the recommendation, recording the reason for the delay."

R-SANC-02:
  headline: "Sanctions in this district usually take longer than 45 days"
  plain: "Half of this district authority's {works:,} sanctions took more than {median:.0f} days from recommendation, and {share:.0%} took longer than the 45 days the guidelines allow (para 3.2.4). Model code of conduct periods are not excluded, so the figures are upper bounds."
  metric: "median {median:.0f} days to sanction"
  benchmark: "45 days (para 3.2.4)"
  actions:
    - "Review the district's sanction backlog and what holds recommendations up."

R-REPAIR-01:
  headline: "Repair and renovation above Rs 50 lakh in a year"
  plain: "Repair and renovation works recommended in {fy} add up to {total} across {works} works. The guidelines allow up to {cap} a year for all such works together (para 5.1.9). Works were identified from their category or description, so the list should be checked."
  plain_portal: "Repair and renovation works recommended in {fy} add up to {total} across {works} works. The guidelines allow up to {cap} a year for all such works together (para 5.1.9). {classed} of these works, worth {classed_total}, are recorded on the portal as repair and renovation; the other {described} are described as repair or renovation under another category, so the list should be checked."
  metric: "{total} in {fy}"
  benchmark: "{cap} a year (para 5.1.9)"
  actions:
    - "Check which of the listed works are repair or renovation, and the year's total."

R-TRUST-01:
  headline: "Societies and trusts above Rs 50 lakh in a year"
  plain: "Works for societies and trusts recommended in {fy} add up to {total} across {works} works. The guidelines allow an MP to recommend up to {cap} a year to all societies and trusts together (para 6.2.6.2). Works were identified from the portal's own category."
  metric: "{total} in {fy}"
  benchmark: "{cap} a year (para 6.2.6.2)"
  actions:
    - "Check the year's recommendations for societies and trusts against the Rs 50 lakh limit."

V-REV-01:
  headline: "Work or site changed after sanction"
  plain: "The portal record of this work changed after it was sanctioned ({fields}). The guidelines allow no change to a work or its site once sanctioned (para 3.2.15). The change was seen on {seen}."
  metric: "changed: {fields}"
  benchmark: "no change after sanction (para 3.2.15)"
  actions:
    - "Compare the current record with the sanction letter and ask why it changed."

V-AMT-01:
  headline_up: "Amount increased after sanction"
  headline_down: "Amount reduced after sanction"
  plain: "The work's amount changed from {old} to {new} ({pct:+.0f}%) after sanction{year_end}. An increase needs a revised estimate and the MP's consent (para 3.2.3)."
  year_end: ", in the last days of the financial year"
  metric: "{pct:+.0f}% revision"
  benchmark: "sanctioned amount"
  actions:
    - "Obtain the revised estimate and the approval behind the change."

V-IA-01:
  headline: "Executing district authority changed after sanction"
  plain: "The district authority on this work changed from {old} to {new} after sanction."
  actions:
    - "Confirm why the work moved to a different district authority."

V-VEN-01:
  headline: "Main vendor on this work changed"
  plain: "The vendor paid the most on this work changed from {old} to {new}{how}"
  with_payment: " when a new payment was made."
  without_payment: " without any new payment, so the vendor on existing payments was changed."
  actions:
    - "Check the payment records and the vendor selection for this work (para 3.2.13)."

V-PAY-01:
  headline: "Total paid on this work went down"
  plain: "Payments recorded against this work fell from {old} to {new}, which means a payment record was reversed or removed."
  metric: "{reduction} less recorded"
  actions:
    - "Ask the implementing agency to explain the reversed payment."

V-LIST-01:
  headline: "Paid work no longer listed on the portal"
  plain: "This work had {paid} paid against it and the portal no longer lists it. A stopped or abandoned work must be referred to the State Nodal Authority (para 3.2.19)."
  metric: "{paid} paid"
  actions:
    - "Confirm whether the work was cancelled, merged or abandoned, and where the payments stand."

V-FREQ-01:
  headline: "Revised unusually often"
  plain: "This work was revised on {revisions} separate occasions, against an average of {average} for revised works of the same type in the state."
  actions:
    - "Review the history of changes to this work."

P-SEQ-01:
  headline: "Payment dated before the work was sanctioned"
  plain: "{count} payment(s) worth {amount} are dated before the work was sanctioned on {sanction}, the earliest on {earliest}. Payments are made against sanctioned works, so one of these dates is wrong on the portal."
  metric: "{count} payment(s) before sanction"
  benchmark: "payments follow sanction"
  actions:
    - "Check the sanction letter and the payment orders to find which date is wrong."

P-LATE-01:
  headline: "Payments long after the work was completed"
  plain: "{count} payment(s) worth {amount} were made more than {min_days} days after the work was recorded as completed on {completed}, the latest {days} days after ({share:.0%} of what was paid on the work). The guidelines expect a completed work's accounts to be finalised quickly (para 11.2); a final bill or a withheld amount paid later is one ordinary explanation."
  metric: "{days} days after completion"
  benchmark: "accounts finalised quickly on completion (para 11.2)"
  actions:
    - "Ask the implementing agency what the later payments were for and why they followed completion."

P-DUP-01:
  headline: "Same payment recorded more than once"
  plain: "{sets} payment(s) on this work are recorded more than once with the same date, amount and vendor: {extra} extra record(s) worth {amount} ({share:.0%} of what was paid on the work). For example, {example} to {vendor} on {day} is recorded {times} times. Equal invoices on one day are possible, so the payment orders decide whether any is a duplicate."
  metric: "{extra} repeated record(s), {amount}"
  benchmark: "one record per payment"
  actions:
    - "Match each repeated record to its own payment order and invoice."

A-PEER-01:
  headline: "Unusual on several measures for its type of work"
  plain: "Compared with {peers:,} works of the same type in the same state, this work is extreme on {count} measures at once: {labels}. Each on its own can have an ordinary explanation; together they are worth a look."
  separator: "; "
  benchmark: "typical values for the same work type and state"
  actions:
    - "Review the sanction, payment and completion records together for this work."

A-COST-01:
  metric: "{cost} actual"
  benchmark: "{benchmark} typical ({peers:,} comparable works)"
  scale:
    headline: "Cost far outside the range for this work type"
    plain: "This work costs {cost} against a typical {benchmark} for the same type of work in this state — about {ratio:,.0f} times higher. A gap this wide usually means the work is a different scale to its peers (for example a whole-ward installation recorded under a single-unit category), so the classification should be checked before reading it as an overrun."
    actions:
      - "Confirm the work's scope and whether it is categorised correctly."
  above:
    headline: "Cost is {pct:.0f}% above comparable works"
    plain: "This work costs {cost}. Comparable works of the same type in {place} typically cost {benchmark} — this is {pct:.0f}% higher. The comparison uses {peers:,} similar works from the same period."
    actions:
      - "Compare the estimate against the state Schedule of Rates for this work type."
      - "Verify measurements and quantities recorded in the measurement book."

A-EXP-01:
  headline: "Annual spending is unusual compared with other constituencies"
  plain: "Spending of {expenditure} in {fy} sits far outside the normal range for that year across all constituencies."
  metric: "{expenditure} in {fy}"
  benchmark: "national distribution for the same year"
  actions:
    - "Review the year's sanction and release records for this constituency."

D-DUP-01:
  pair:
    headline: "Listed twice on the portal: recommendation and sanctioned record"
    plain: "The portal still lists the original recommendation {pending} (stage \"{stage}\") alongside the sanctioned record {sanctioned}, for the same member and the same recommendation date ({date}). This is how the portal keeps a work that has moved from recommendation to sanction, so it is probably one work rather than a double entry. It is shown for completeness and does not add to the risk score."
    stage_unknown: "not recorded"
    metric: "{similarity:.0f}% description match, same member and date"
    benchmark: "one record per work expected"
    actions:
      - "If needed, confirm on the portal that {pending} is the recommendation that became {sanctioned}."
  match:
    headline_strong: "Very likely the same work recorded twice"
    headline_similar: "Closely similar to another work nearby"
    plain: "The description is {similarity:.0f}% identical to work {pair} in the same district{same_amount}. Approval checks look at one work at a time, so a repeat entry like this is not caught by the normal workflow. The two records should be checked to confirm whether they are separate assets."
    same_amount: ", and both are sanctioned for the same amount ({cost})"
    metric: "{similarity:.0f}% description match"
    benchmark: "{threshold:.0f}% similarity threshold"
    actions:
      - "Compare this work's file against work {pair}."
      - "Confirm the two works are at different locations before further release."

D-DUP-02:
  headline: "Several works share one vague description"
  plain: "{size} works in {district} are all described only as \"{description}\", together worth {total}. They are probably distinct assets, but the descriptions are too thin for anyone to verify that from the record."
  metric: "{size} works, {total}"
  benchmark: "distinct locations expected per work"
  actions:
    - "Ask the agency to record specific locations for each of these works."

N-NET-01:
  kind:
    agency: "implementing agency"
    district_authority: "district authority"
    vendor: "vendor"
  headline: "Unusual pattern for this {kind}"
  spread: "appears on {works} works across {districts} districts"
  overrun: "{share:.0f}% of its works are priced above comparable works"
  join: " and "
  plain: "This {kind} {bits}. {same_name}{national}This is a pattern worth understanding, not an allegation against the firm."
  same_name: "It is grouped by its portal vendor id; {count} other vendor id(s) share its name and are counted separately. "
  national: "Its work types (vehicles, books, equipment) are commonly supplied nationally, so wide coverage may be entirely normal. "
  metric: "{works} works, {districts} districts"
  benchmark: "{threshold} districts typical"
  actions:
    - "Review other flagged works involving this agency for a common cause."

# -------------------------------------------------------------------- briefs

tier:
  mp:
    label: "Member of Parliament"
    lens: "Works you have recommended in your constituency"
    opening: "One of the works recommended from your office needs attention."
    closing: "Your office can close this by asking the district authority for a written explanation. This is a review prompt, not an allegation against you or the agency."
  district:
    label: "District Authority"
    lens: "Ground-level execution and verification"
    opening: "This work requires verification before further release."
    closing: "Record your verification in eSAKSHI so the state and Ministry views update automatically."
  state:
    label: "State Nodal Authority"
    lens: "Patterns repeating across districts"
    opening: "This case contributes to a pattern worth reviewing across districts."
    closing: "Check whether the same work type or agency recurs elsewhere in the state before the next release cycle."
  ministry:
    label: "Ministry (MoSPI)"
    lens: "National trends and policy signals"
    opening: "This case feeds the national exception statistics."
    closing: "The policy question is whether this rule's threshold needs recalibrating, based on how often reviewers mark it a false positive."

brief:
  matches: "{headline} ({count} matches)"
  review_required: "Review required"
  no_actions: "Verify the supporting records for this work with the implementing agency."
  corroboration_many: "{count} independent agents each raised a separate issue with this case. Signals that reinforce one another carry more weight than any single check, which is why this case scores highly."
  corroboration_one: "Raised by one agent ({agent})."
  next_step: "Suggested next step: {action}"
  disclaimer: "This is an AI-generated risk indicator for human review. It is not a determination of fraud or wrongdoing."
  tier_action:
    mp: "Ask the district authority for a written explanation before recommending the next instalment."
    state: "Check whether this work type or agency recurs across other districts in the state."
    ministry: "Track this rule's false-positive rate before changing its threshold."

note:
  same_authority: "The same district authority has {count:,} other flagged cases in this dataset, so a common cause may be worth checking."
  reduced: "Data confidence is reduced: {reasons}. Verify the record on the portal first."

title:
  district_authority: "{name} district authority"
  constituency: "{name} constituency"

clause:
  cite: "{lead}, para {para}: {summary}"
  cite_bare: "{lead}, para {para}"
  lead: "MPLADS Guidelines 2023"
  marker:
    cost_ceiling: "ASTRA review marker; the MPLADS Guidelines 2023 set no maximum value for a single work"

# -------------------------------------------------------- synthesis and plans

synthesis:
  evidence: "{metric} vs {benchmark}"
  not_recorded: "not recorded"
  plan_rationale: "These steps are the actions available to this authority for the evidence found, ordered from immediate verification through to escalation."
  insufficient: "Available evidence is insufficient to draw a stronger conclusion."
  limitation:
    no_sanction: "This work has not reached sanction, so no sanctioned amount is available for comparison."
    no_completion: "No completion date is recorded, so completion could not be confirmed from the data."
    no_vendor: "No vendor payment record is present for this work."
    no_duplicate: "No duplicate-record evidence was identified for this case."
    records_only: "The system analyses recorded data only; it cannot verify physical work on the ground."
    unverified: "Some figures in this summary could not be matched to the underlying evidence and have been marked for checking."

plan:
  detected: "The system detected: {headline}."
  concern: "the flagged concern"
  if_unresolved: "Only if the checks above do not resolve the concern."
  escalation: "Only if material concerns remain after verification."
  constraint_notice: "Recommendations are generated within the actions permitted for this authority level. Final decisions and actions remain with authorised human officials."

# ------------------------------------------------------------ pipeline page

stood_down:
  years: "Needs {needed} completed financial years with an entitlement; the data has {years}. Years still in progress are excluded because their works are still being paid for."
  history: "Stands down until there is enough history to compare: {span} day(s) of observed edits on {revised} work(s), against {days} days and {works} works needed."
  no_edits: "No edits observed on the portal yet; the portal publishes no history, so revisions are visible only from when polling began."
  no_category: "The portal category that identifies these works is not in this corpus."
  no_payments: "No individual payment records are stored for this corpus."

router:
  ready: "required inputs present"
  skipped: "skipped — missing usable inputs: {missing}"
