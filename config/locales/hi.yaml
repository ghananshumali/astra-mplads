  metric: "स्वीकृति से पहले {count} भुगतान"
  benchmark: "भुगतान स्वीकृति के बाद होते हैं"
  actions:
    - "कौन-सी तिथि गलत है, यह जानने के लिए स्वीकृति पत्र और भुगतान आदेशों की जाँच करें।"

P-LATE-01:
  headline: "कार्य पूर्ण होने के बहुत बाद भुगतान"
  plain: "{amount} के {count} भुगतान कार्य के {completed} को पूर्ण दर्ज होने के {min_days} दिन से अधिक बाद किए गए, सबसे बाद वाला {days} दिन बाद (कार्य पर हुए भुगतान का {share:.0%})। दिशानिर्देश अपेक्षा करते हैं कि पूर्ण कार्य के खाते शीघ्र अंतिम किए जाएँ (पैरा 11.2); बाद में चुकाया गया अंतिम बिल या रोकी गई राशि इसका एक सामान्य कारण हो सकता है।"
  metric: "पूर्णता के {days} दिन बाद"
  benchmark: "पूर्णता पर खाते शीघ्र अंतिम (पैरा 11.2)"
  actions:
