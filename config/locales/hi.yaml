R-TRUST-01:
  headline: "एक वर्ष में सोसाइटियों और ट्रस्टों के लिए ₹50 लाख से अधिक"
  plain: "{fy} में सोसाइटियों और ट्रस्टों के लिए अनुशंसित कार्य {works} कार्यों में कुल {total} के हैं। दिशानिर्देश सांसद को सभी सोसाइटियों और ट्रस्टों के लिए मिलाकर एक वर्ष में {cap} तक की अनुशंसा की अनुमति देते हैं (पैरा 6.2.6.2)। कार्यों की पहचान पोर्टल की अपनी श्रेणी से की गई है।"
  metric: "{fy} में {total}"
  benchmark: "प्रति वर्ष {cap} (पैरा 6.2.6.2)"
  actions:
    - "वर्ष में सोसाइटियों और ट्रस्टों के लिए की गई अनुशंसाओं का ₹50 लाख की सीमा से मिलान करें।"

V-REV-01:
  headline: "स्वीकृति के बाद कार्य या स्थल बदला"
  plain: "स्वीकृति के बाद पोर्टल पर इस कार्य का अभिलेख बदला ({fields})। दिशानिर्देश स्वीकृति के बाद कार्य या उसके स्थल में किसी बदलाव की अनुमति नहीं देते (पैरा 3.2.15)। यह बदलाव {seen} को देखा गया।"
  metric: "बदला: {fields}"
  benchmark: "स्वीकृति के बाद कोई बदलाव नहीं (पैरा 3.2.15)"
  actions:
    - "वर्तमान अभिलेख की तुलना स्वीकृति पत्र से करें और बदलाव का कारण पूछें।"

V-AMT-01:
  headline_up: "स्वीकृति के बाद राशि बढ़ी"
  headline_down: "स्वीकृति के बाद राशि घटी"
  plain: "स्वीकृति के बाद कार्य की राशि {old} से बदलकर {new} ({pct:+.0f}%) हो गई{year_end}। राशि बढ़ने पर संशोधित प्राक्कलन और सांसद की सहमति आवश्यक है (पैरा 3.2.3)।"
  year_end: ", वित्तीय वर्ष के अंतिम दिनों में"
  metric: "{pct:+.0f}% संशोधन"
  benchmark: "स्वीकृत राशि"
  actions:
