V-IA-01:
  headline: "स्वीकृति के बाद कार्यान्वयन ज़िला प्राधिकरण बदला"
  plain: "स्वीकृति के बाद इस कार्य का ज़िला प्राधिकरण {old} से बदलकर {new} हो गया।"
  actions:
    - "पुष्टि करें कि कार्य किसी अन्य ज़िला प्राधिकरण को क्यों सौंपा गया।"

V-VEN-01:
  headline: "इस कार्य का मुख्य विक्रेता बदला"
  plain: "इस कार्य पर सबसे अधिक भुगतान पाने वाला विक्रेता {old} से बदलकर {new} हो गया{how}"
  with_payment: ", जब एक नया भुगतान किया गया।"
  without_payment: ", बिना किसी नए भुगतान के — यानी मौजूदा भुगतानों पर दर्ज विक्रेता बदला गया।"
  actions:
    - "इस कार्य के भुगतान अभिलेखों और विक्रेता चयन की जाँच करें (पैरा 3.2.13)।"

V-PAY-01:
  headline: "इस कार्य पर कुल भुगतान घट गया"
  plain: "इस कार्य पर दर्ज भुगतान {old} से घटकर {new} हो गए, यानी कोई भुगतान अभिलेख उलटा गया या हटाया गया।"
  metric: "{reduction} कम दर्ज"
  actions:
    - "कार्यान्वयन एजेंसी से उलटे गए भुगतान का स्पष्टीकरण माँगें।"

V-LIST-01:
  headline: "भुगतान वाला कार्य अब पोर्टल पर सूचीबद्ध नहीं"
  plain: "इस कार्य पर {paid} का भुगतान हुआ था और पोर्टल अब इसे सूचीबद्ध नहीं करता। रोके गए या छोड़े गए कार्य को राज्य नोडल प्राधिकरण को भेजा जाना चाहिए (पैरा 3.2.19)।"
  metric: "{paid} का भुगतान"
  actions:
    - "पुष्टि करें कि कार्य रद्द हुआ, किसी अन्य कार्य में मिलाया गया या छोड़ दिया गया, और भुगतानों की स्थिति क्या है।"

V-FREQ-01:
  headline: "असामान्य रूप से बार-बार संशोधित"
  plain: "इस कार्य में {revisions} अलग-अलग अवसरों पर संशोधन हुआ, जबकि राज्य में उसी प्रकार के संशोधित कार्यों का औसत {average} है।"
  actions:
    - "इस कार्य में हुए बदलावों के इतिहास की समीक्षा करें।"

P-SEQ-01:
  headline: "कार्य की स्वीकृति से पहले की तिथि का भुगतान"
