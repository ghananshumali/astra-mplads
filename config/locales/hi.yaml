P-DUP-01:
  headline: "एक ही भुगतान एक से अधिक बार दर्ज"
  plain: "इस कार्य पर {sets} भुगतान एक ही तिथि, राशि और विक्रेता के साथ एक से अधिक बार दर्ज हैं: {amount} के {extra} अतिरिक्त अभिलेख (कार्य पर हुए भुगतान का {share:.0%})। उदाहरण के लिए, {day} को {vendor} को {example} का भुगतान {times} बार दर्ज है। एक ही दिन बराबर राशि के अलग-अलग बिल संभव हैं, इसलिए कोई दोहराव है या नहीं, यह भुगतान आदेशों से ही तय होगा।"
  metric: "{extra} दोहराए गए अभिलेख, {amount}"
  benchmark: "हर भुगतान का एक अभिलेख"
  actions:
    - "हर दोहराए गए अभिलेख का उसके अपने भुगतान आदेश और बिल से मिलान करें।"

A-PEER-01:
  headline: "अपने प्रकार के कार्य के लिए कई मापदंडों पर असामान्य"
