    "3.2.4": "कार्यान्वयन ज़िला प्राधिकरण अनुशंसा प्राप्त होने के 45 दिनों के भीतर स्वीकृति या अस्वीकृति जारी करता है।"
    "3.2.5": "किसी वर्ष में सांसद के स्वीकृत कार्यों की कुल अनुमानित लागत उस वर्ष तक की पात्रता से, ब्याज और पुनर्वितरण सहित, अधिक नहीं होनी चाहिए।"
    "3.2.6": "इन समय-सीमाओं की गणना में ज़िले में लागू आदर्श आचार संहिता की अवधि नहीं गिनी जाती।"
    "3.2.9": "एक कार्य सामान्यतः कम से कम ₹2.5 लाख के लिए स्वीकृत होना चाहिए; ज़िला प्राधिकरण स्वीकृति पत्र में कारण दर्ज करे तो छोटी राशि की अनुमति है।"
    "3.2.10": "कार्यान्वयन ज़िला प्राधिकरण राज्य सरकार के नियमों के अनुसार हर कार्य को निष्पादित करने वाली एजेंसी का चयन करता है।"
    "3.2.12": "स्वीकृति पत्र में पूर्णता की अवधि तय होती है, जो सामान्यतः एक वर्ष से अधिक नहीं होनी चाहिए; अधिक अवधि के लिए, जैसे कठिन या पहाड़ी भूभाग में, स्वीकृति पत्र में औचित्य दर्ज होना चाहिए।"
    "3.2.13": "कार्यान्वयन एजेंसियाँ दर-अनुसूची के आधार पर कार्यों का प्राक्कलन बनाती हैं और खुली, पारदर्शी बोली से विक्रेताओं का चयन करती हैं।"
    "3.2.15": "सांसद स्वीकृति से पहले किसी कार्य या उसके स्थल को बदल या रद्द कर सकते हैं; कार्य स्वीकृत होने के बाद कोई बदलाव अनुमत नहीं है।"
    "3.2.19": "प्रगति पर चल रहे कार्य को रोकने या छोड़ने का मामला औचित्य के साथ राज्य नोडल प्राधिकरण को भेजा जाता है।"
    "4.4.2": "हर वर्ष ₹25 लाख या अधिक के सभी कार्यों, ₹15 से 25 लाख के आधे कार्यों और शेष कार्यों के एक नमूने का तृतीय-पक्ष निरीक्षण होता है।"
    "5.1.9": "अचल परिसंपत्तियों की मरम्मत और नवीनीकरण की अनुमति है, ऐसे सभी कार्यों के लिए मिलाकर प्रति सांसद प्रति वर्ष ₹50 लाख तक, निर्माण या पिछली मरम्मत के बाद उचित अंतराल पर।"
    "5.2.1": "किसी भी प्रकार का संचालन और रखरखाव।"
    "5.2.2": "आवासीय भवन, चाहे सरकारी, सार्वजनिक क्षेत्र के या अन्य।"
    "5.2.3": "वाणिज्यिक या निजी प्रतिष्ठानों से जुड़े कार्य।"
    "5.2.4": "किसी जीवित या दिवंगत व्यक्ति के नाम पर परिसंपत्ति का नामकरण।"
    "5.2.5": "अनुदान और ऋण।"
    "5.2.6": "केंद्र या राज्य के राहत कोषों में योगदान।"
    "5.2.7": "भूमि अधिग्रहण या भूमि का मुआवज़ा।"
    "5.2.8": "पूर्ण या आंशिक रूप से पूर्ण कार्यों या ख़रीद की प्रतिपूर्ति, या छोड़ी गई परियोजनाओं को पूरा करना।"
    "5.2.9": "व्यक्तिगत या पारिवारिक लाभ की परिसंपत्तियाँ, सिवाय 5.1.6 के अंतर्गत दिव्यांगजनों के लिए सहायक उपकरणों के।"
    "5.2.10": "MPLADS निधि को CSR निधि के साथ मिलाना।"
    "5.2.11": "धार्मिक प्रकृति के कार्य, पूजा स्थलों के भीतर के कार्य, या किसी धार्मिक समूह की भूमि पर कार्य।"
    "5.2.12": "स्वागत द्वार।"
    "5.2.13": "अनधिकृत कॉलोनियों में कार्य।"
    "5.2.14": "किसी भी प्रकार का आवर्ती व्यय।"
    "5.4.1": "हर वर्ष सांसद वर्ष की पात्रता के कम से कम 15% के कार्य अनुसूचित जाति बहुल क्षेत्रों के लिए और कम से कम 7.5% के कार्य अनुसूचित जनजाति बहुल क्षेत्रों के लिए अनुशंसित करते हैं।"
    "5.4.2": "जहाँ किसी लोक सभा निर्वाचन क्षेत्र में अनुसूचित जनजाति के निवासी बहुत कम हों, वहाँ वह हिस्सा अनुसूचित जाति क्षेत्रों को दिया जा सकता है, और इसका उलटा भी।"
    "6.2.6.2": "सांसद सभी पंजीकृत सोसाइटियों और ट्रस्टों को मिलाकर प्रति वर्ष ₹50 लाख तक, और एक कार्यकाल में किसी एक सोसाइटी या ट्रस्ट को अधिकतम ₹1 करोड़ की अनुशंसा कर सकते हैं।"
    "6.3.4": "सोसाइटियों और ट्रस्टों के लिए ₹50 लाख प्रति वर्ष की सीमा सहकारी समितियों पर भी समान रूप से लागू होती है।"
    "8.1": "भारत सरकार द्वारा घोषित गंभीर प्रकृति की आपदा से प्रभावित क्षेत्रों में पुनर्वास के लिए कोई भी सांसद प्रति वर्ष ₹1 करोड़ तक की सहमति दे सकते हैं।"
    "8.2": "केवल राज्य द्वारा घोषित गंभीर आपदा के लिए उस राज्य के सांसद प्रति वर्ष ₹25 लाख तक की सहमति दे सकते हैं।"
    "8.12.1": "पुनर्वास कार्य अनुमोदन के 18 महीनों के भीतर पूरे किए जाते हैं।"
    "10.1": "निधि केंद्रीय नोडल खाते में रहती है और भुगतान की माँग आने पर सीधे विक्रेताओं के खाते में जमा होती है; अलग से कोई निर्गम नहीं होता।"
    "10.2.3": "केंद्रीय नोडल खाते की निधि वर्ष के अंत में वापस नहीं की जाती और आगे के वर्षों में उपलब्ध रहती है।"
    "10.4.3": "किसी वर्ष के लिए सांसद का आवंटन सेवा के महीनों पर निर्भर करता है: 3 महीने से कम पर शून्य, 3 से 9 महीने पर आधा, 9 महीने से अधिक पर पूरा।"
    "10.4.4": "सांसद का अप्रयुक्त आवंटन अगले वर्ष में आगे ले जाया जाता है।"
    "10.6.1": "पूर्व सांसद के स्वीकृत कार्य सांसद के पद छोड़ने के 18 महीनों के भीतर पूरे किए जाते हैं, और खाता 21 महीनों के भीतर बंद किया जाता है।"
    "10.7.1": "कार्यान्वयन एजेंसी द्वारा अधिकृत किए जाने पर सभी भुगतान केंद्रीय नोडल खाते से सीधे और तत्काल विक्रेताओं को जाते हैं।"
    "11.2": "कार्य पूर्ण होने पर कार्यान्वयन एजेंसी या प्राधिकरण उस कार्य के खाते शीघ्र अंतिम करते हैं और उपयोगिता प्रमाणपत्र प्रस्तुत करते हैं।"
    "11.4.1": "विक्रेता को हर भुगतान होने पर कार्यान्वयन प्राधिकरण उपयोगिता प्रमाणपत्र प्रस्तुत करते हैं।"

