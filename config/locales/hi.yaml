# हिन्दी — case text in Hindi (see astra/locale.py and en.yaml).
#
# A draft translation awaiting review by native speakers; English (en.yaml) is
# the reference. Same keys and the same {placeholders} as English, checked by
# tests/test_case_language.py. Figures, work ids, names and paragraph numbers
# are never translated. Framing rules apply here as in English: a detection is
# a risk indicator (जोखिम संकेतक) for human review (मानवीय समीक्षा), never a
# finding of fraud or wrongdoing.
#
# Terms, matching the Hindi interface (frontend/src/i18n/locales/hi.json):
#   case मामला · work कार्य · sanction स्वीकृति · recommendation अनुशंसा ·
#   district authority ज़िला प्राधिकरण · vendor विक्रेता · guidelines दिशानिर्देश ·
#   para पैरा · estimate प्राक्कलन · entitlement पात्रता · record अभिलेख
#
# Beyond English's keys, this file translates text whose English lives
# elsewhere: clause.rule (rules.yaml), clause.para (guidelines_2023.yaml),
# measure (agents/anomaly.py), field (portal field names), rule (rule titles)
# and unchecked (data_contract.UNCHECKABLE).

money:
  lakh: "₹{amount} लाख"
  crore: "₹{amount} करोड़"

list_separator: ", "

agent:
  compliance:
    label: "अनुपालन एजेंट"
    role: "हर कार्य को MPLADS योजना के नियमों पर जाँचता है"
  anomaly:
    label: "सांख्यिकीय विसंगति एजेंट"
    role: "लागत की तुलना उसी राज्य के समान कार्यों से करता है"
  entity_resolution:
    label: "इकाई मिलान एजेंट"
    role: "एक ही कार्य के एक से अधिक बार दर्ज होने की जाँच करता है"
  network:
    label: "नेटवर्क विश्लेषण एजेंट"
    role: "विक्रेताओं, कार्यान्वयन एजेंसियों और ज़िला प्राधिकरणों के पैटर्न देखता है"
  revisions:
    label: "संशोधन एजेंट"
    role: "स्वीकृति के बाद कार्य में हुए बदलाव देखता है"
  payments:
    label: "भुगतान एजेंट"
    role: "हर भुगतान को कार्य की स्वीकृति और पूर्णता की तिथियों से मिलाता है"

severity:
  critical: "अत्यंत गंभीर"
  high: "उच्च"
  medium: "मध्यम"
  low: "कम"

risk_band:
  high: "उच्च जोखिम"
  medium: "मध्यम जोखिम"
  low: "कम जोखिम"

# ------------------------------------------------------------------ findings

finding:
  default_action: "इस कार्य के सहायक अभिलेखों का सत्यापन करें।"

confidence:
  plain: "{plain} डेटा की विश्वसनीयता कम है: {reasons}।"
  separator: "; "
  action: "इस संकेत पर कार्रवाई से पहले पोर्टल पर अभिलेख का सत्यापन करें।"
  reason:
    parity_differs: "क्षेत्र के संग्रहीत आँकड़े अभी पोर्टल के आँकड़ों से भिन्न हैं"
    unchecked: "क्षेत्र के आँकड़ों का अभी तक पोर्टल के आँकड़ों से मिलान नहीं हुआ है"
    failed: "क्षेत्र को पढ़ने के पिछले {count} प्रयास विफल रहे"
    stale: "क्षेत्र को {since} UTC के बाद से सफलतापूर्वक नहीं पढ़ा जा सका है"
    held_back: "क्षेत्र की पिछली पढ़ाई सत्यापन जाँच में रोक दी गई"
    missing: "क्षेत्र में पहले सूचीबद्ध {count} कार्य अब नहीं मिल रहे और पुष्टि की प्रतीक्षा में हैं"

R-TIME-01:
  headline: "एक वर्ष में पूर्णता के मानक की तुलना में कार्य में विलंब"
  plain: "यह कार्य {days:,} दिन ({years:.1f} वर्ष) पहले स्वीकृत हुआ था और {progress}। दिशानिर्देशों के अनुसार स्वीकृति पत्र में पूर्णता की अवधि सामान्यतः एक वर्ष से अधिक नहीं होनी चाहिए (पैरा 3.2.12); स्वीकृति पत्र में औचित्य दर्ज होने पर अधिक अवधि की अनुमति है।"
  incomplete: "अभी तक पूर्ण नहीं हुआ है"
  completed_late: "देर से पूर्ण दर्ज हुआ है"
  metric: "स्वीकृति के बाद {days:,} दिन"
  benchmark: "{max_days} दिन (पैरा 3.2.12)"
  actions:
    - "कार्यान्वयन एजेंसी से वर्तमान भौतिक प्रगति रिपोर्ट प्राप्त करें।"
    - "जाँचें कि क्या स्वीकृति पत्र में एक वर्ष से अधिक अवधि का औचित्य दिया गया था।"
    - "एजेंसी से विलंब का कारण और संशोधित पूर्णता तिथि दर्ज करने को कहें।"

R-PROH-01:
  para_ref: " (पैरा {para})"
  activity:
    headline: "संभव है कि यह व्यय MPLADS के अंतर्गत स्वीकार्य न हो"
    plain: "विवरण में '{term}' का उल्लेख है, जो दिशानिर्देशों की अनुमत न होने वाले कार्यों की सूची में आता है{para_ref}। किसी परिसंपत्ति की मरम्मत और नवीनीकरण की अनुमति है (पैरा 5.1.9), इसलिए किसी भी भुगतान से पहले कार्य के दायरे की पुष्टि आवश्यक है।"
    actions:
      - "प्राक्कलन से पुष्टि करें कि व्यय वास्तव में किस लिए है।"
  asset:
    headline: "संभव है कि परिसंपत्ति योजना की अनुमत न होने वाली सूची में आती हो"
    plain: "कार्य विवरण से लगता है कि बनाई जा रही परिसंपत्ति '{term}' है, जिसकी दिशानिर्देश अनुमति नहीं देते{para_ref}। इसकी पुष्टि आवश्यक है — विवरणों में अक्सर आस-पास के स्थलों के नाम होते हैं, इसलिए वास्तविक परिसंपत्ति अनुमत भी हो सकती है।"
    actions:
      - "स्वीकृति फ़ाइल से पुष्टि करें कि वास्तव में कौन-सी परिसंपत्ति बनाई जा रही है।"
  metric: "मेल खाता शब्द: '{term}'"
  benchmark: "अनुमत न होने वाले कार्य, पैरा {para}"

R-COST-01:
  summary:
    headline: "कई कार्य सामान्य न्यूनतम मूल्य से कम पर स्वीकृत"
    plain: "इस ज़िला प्राधिकरण के {out_of:,} स्वीकृत कार्यों में से {works:,} ({share:.0%}) ₹2.5 लाख से कम के हैं। दिशानिर्देश छोटे कार्य की अनुमति तभी देते हैं जब स्वीकृति पत्र में कारण दर्ज हों (पैरा 3.2.9)।"
    metric: "₹2.5 लाख से कम के {works:,} कार्य"
    benchmark: "₹2.5 लाख सामान्य न्यूनतम (पैरा 3.2.9)"
    actions:
      - "सूचीबद्ध उदाहरणों से शुरू करते हुए, इन स्वीकृति पत्रों में दर्ज कारणों की नमूना जाँच करें।"
  floor:
    headline: "सामान्य न्यूनतम कार्य मूल्य से कम पर स्वीकृत"
    plain: "यह कार्य {cost} पर स्वीकृत है। दिशानिर्देशों के अनुसार एक कार्य सामान्यतः कम से कम {floor} का होना चाहिए, और छोटे कार्य की अनुमति तब है जब ज़िला प्राधिकरण स्वीकृति पत्र में कारण दर्ज करे (पैरा 3.2.9)। बहुत छोटे कार्य यह भी संकेत दे सकते हैं कि किसी बड़े कार्य को टुकड़ों में बाँटा गया है।"
    metric: "{cost} स्वीकृत"
    benchmark: "{floor} सामान्य न्यूनतम (पैरा 3.2.9)"
    actions:
      - "जाँचें कि स्वीकृति पत्र में कम राशि के कारण दर्ज हैं।"
      - "जाँचें कि क्या यह किसी बड़े कार्य का हिस्सा है जिसे छोटी स्वीकृतियों में बाँटा गया है।"
  ceiling:
    headline: "बड़ा एकल कार्य: विस्तृत प्राक्कलन जाँचें"
    plain: "यह कार्य {cost} पर स्वीकृत है, जो {ceiling} के उस मूल्य से अधिक है जिसे ASTRA प्राक्कलन की जाँच के संकेत के रूप में उपयोग करता है। दिशानिर्देश किसी कार्य के लिए कोई अधिकतम सीमा तय नहीं करते; ₹25 लाख या अधिक के कार्यों का तृतीय-पक्ष निरीक्षण भी आवश्यक है (पैरा 4.4.2)।"
    metric: "{cost} स्वीकृत"
    benchmark: "{ceiling} ASTRA समीक्षा संकेतक (योजना की सीमा नहीं)"
    actions:
      - "इस आकार के कार्य के विस्तृत प्राक्कलन और तकनीकी स्वीकृति का सत्यापन करें।"

R-PILE-01:
  headline: "निधि का बड़ा हिस्सा अप्रयुक्त पड़ा है"
  plain: "{years} पूर्ण वर्षों में अनुशंसित कार्यों पर व्यय उन वर्षों की {entitlement} की पात्रता का केवल {pct:.0f}% है। MPLADS निधि समाप्त नहीं होती बल्कि आगे ले जाई जाती है (पैरा 10.4.4), इसलिए अप्रयुक्त राशि जमा होती जाती है — यह कार्यकुशलता की चिंता है, नियम का उल्लंघन नहीं।"
  metric: "निधि का {pct:.0f}% उपयोग"
  benchmark: "{threshold:.0f}% सीमा"
  actions:
    - "लंबित कार्यों की सूची की समीक्षा करें और पहचानें कि क्रियान्वयन में क्या बाधा है।"

R-SPIKE-01:
  headline: "निष्क्रिय वर्षों के बाद व्यय में अचानक उछाल"
  plain: "{fy} में उपयोग बढ़कर {spike:.0f}% हो गया, जबकि पिछले वर्षों का औसत {dormant:.0f}% था। MPLADS निधि कभी व्यपगत नहीं होती, इसलिए देर से आया उछाल जल्दबाज़ी में, वर्ष के अंत में किए गए व्यय का संकेत हो सकता है।"
  metric: "{fy} में {spike:.0f}%"
  benchmark: "पिछले वर्षों में {dormant:.0f}%"
  actions:
    - "जाँचें कि उछाल वाले वर्ष में स्वीकृत कार्यों का मूल्यांकन सामान्य प्रक्रिया से हुआ था।"

R-SCST-02:
  headline: "{kind}-आरक्षित निर्वाचन क्षेत्रों में व्यय का कम हिस्सा"
  plain: "{state} में {kind}-आरक्षित निर्वाचन क्षेत्रों को MPLADS व्यय का {pct:.1f}% मिला, जबकि योजना का मानक {benchmark}% है। यह केवल प्रारंभिक जाँच का संकेतक है — योजना की अपेक्षा SC/ST क्षेत्रों से संबंधित है, जिनका इस डेटा में अलग विवरण नहीं है।"
  metric: "राज्य के व्यय का {pct:.1f}%"
  benchmark: "योजना का मानक {benchmark}%"
  actions:
    - "क्षेत्रवार वास्तविक अनुपालन आँकने के लिए ज़िला-स्तरीय आवंटन डेटा प्राप्त करें।"

R-SANC-01:
  benchmark: "45 दिन (पैरा 3.2.4)"
  summary:
    headline: "45 दिनों से अधिक समय से स्वीकृति की प्रतीक्षा में अनुशंसाएँ"
    plain: "इस ज़िला प्राधिकरण को भेजी गई {works:,} अनुशंसाएँ स्वीकृति या अस्वीकृति के लिए 45 दिनों से अधिक समय से प्रतीक्षा में हैं (लंबित अनुशंसाओं का {share:.0%})। दिशानिर्देश 45 दिन देते हैं (पैरा 3.2.4), जिनमें आदर्श आचार संहिता की अवधि नहीं गिनी जाती (पैरा 3.2.6); यह गणना उस अवधि को अलग नहीं कर सकती।"
    metric: "45 दिनों से अधिक से प्रतीक्षा में {works:,}"
    actions:
      - "सबसे लंबे समय से प्रतीक्षारत अनुशंसाओं से शुरू करते हुए, ज़िला प्राधिकरण के साथ लंबित सूची की समीक्षा करें।"
  single:
    headline: "45 दिनों से अधिक समय से स्वीकृति की प्रतीक्षा में अनुशंसा"
    plain: "इस कार्य की अनुशंसा {days:,} दिन पहले हुई थी और इसे अभी तक न स्वीकृत किया गया है, न अस्वीकृत। दिशानिर्देश ज़िला प्राधिकरण को 45 दिन देते हैं (पैरा 3.2.4)। गणना अनुशंसा की तिथि से होती है और आदर्श आचार संहिता की अवधि को अलग नहीं कर सकती, जिसे दिशानिर्देश नहीं गिनते (पैरा 3.2.6), इसलिए वास्तविक विलंब कम हो सकता है।"
    metric: "{days:,} दिन से प्रतीक्षा"
    actions:
      - "ज़िला प्राधिकरण से विलंब का कारण दर्ज करते हुए अनुशंसा को स्वीकृत या अस्वीकृत करने को कहें।"

R-SANC-02:
  headline: "इस ज़िले में स्वीकृति में सामान्यतः 45 दिनों से अधिक समय लगता है"
  plain: "इस ज़िला प्राधिकरण की {works:,} स्वीकृतियों में से आधी में अनुशंसा से {median:.0f} दिनों से अधिक लगे, और {share:.0%} में दिशानिर्देशों द्वारा अनुमत 45 दिनों से अधिक समय लगा (पैरा 3.2.4)। आदर्श आचार संहिता की अवधि अलग नहीं की गई है, इसलिए ये आँकड़े ऊपरी सीमा हैं।"
  metric: "स्वीकृति में माध्यिका {median:.0f} दिन"
  benchmark: "45 दिन (पैरा 3.2.4)"
  actions:
    - "ज़िले में लंबित स्वीकृतियों और अनुशंसाओं को रोकने वाले कारणों की समीक्षा करें।"

R-REPAIR-01:
  headline: "एक वर्ष में ₹50 लाख से अधिक मरम्मत और नवीनीकरण"
  plain: "{fy} में अनुशंसित मरम्मत और नवीनीकरण के कार्य {works} कार्यों में कुल {total} के हैं। दिशानिर्देश ऐसे सभी कार्यों के लिए मिलाकर एक वर्ष में {cap} तक की अनुमति देते हैं (पैरा 5.1.9)। कार्यों की पहचान उनकी श्रेणी या विवरण से की गई है, इसलिए सूची की जाँच की जानी चाहिए।"
  plain_portal: "{fy} में अनुशंसित मरम्मत और नवीनीकरण के कार्य {works} कार्यों में कुल {total} के हैं। दिशानिर्देश ऐसे सभी कार्यों के लिए मिलाकर एक वर्ष में {cap} तक की अनुमति देते हैं (पैरा 5.1.9)। इनमें से {classed} कार्य, कुल {classed_total} के, पोर्टल पर मरम्मत और नवीनीकरण के रूप में दर्ज हैं; शेष {described} कार्यों के विवरण में मरम्मत या नवीनीकरण लिखा है पर वे किसी अन्य श्रेणी में दर्ज हैं, इसलिए सूची की जाँच की जानी चाहिए।"
  metric: "{fy} में {total}"
  benchmark: "प्रति वर्ष {cap} (पैरा 5.1.9)"
  actions:
